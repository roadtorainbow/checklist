<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>外匯計算機</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background-color: #000000;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .calculator {
      width: 100%;
      max-width: 480px;
      height: 100%;
      background: #000000;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
    }

    /* 頂部匯率設定區 */
    .rate-setting {
      background: #1c1c1e;
      border-radius: 14px;
      padding: 12px 18px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      font-size: 18px;
      font-weight: 600;
      color: #ddd;
    }
    .rate-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .rate-item input {
      width: 80px;
      background: #2c2c2e;
      border: 1px solid #555;
      color: #fff;
      border-radius: 8px;
      text-align: right;
      padding: 4px 6px;
      font-size: 18px;
      font-weight: bold;
    }

    /* 顯示區域 (大幅放大數字) */
    .display-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 10px 8px;
      gap: 16px;
    }
    .currency-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border-radius: 16px;
      cursor: pointer;
      user-select: none;
    }
    .currency-row.active {
      background: #1c1c1e;
      border: 1px solid #333;
    }
    .currency-tag {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 28px;
      font-weight: 700;
      color: #ff9f0a;
    }
    .currency-tag.base {
      color: #aaa;
    }
    .currency-amount {
      font-size: 64px; /* 數字再次放大 */
      font-weight: 700;
      word-break: break-all;
      text-align: right;
      line-height: 1.1;
    }
    .switch-hint {
      font-size: 14px;
      color: #777;
      margin-left: 4px;
    }

    /* 按鈕區域 (按鈕與字體加大) */
    .keypad {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      padding-bottom: 10px;
    }
    .btn {
      height: 80px;
      border: none;
      border-radius: 20px;
      font-size: 42px; /* 按鈕數字放大 */
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      user-select: none;
      transition: opacity 0.1s;
    }
    .btn:active {
      opacity: 0.6;
    }
    .btn-dark {
      background-color: #333333;
      color: #ffffff;
    }
    .btn-orange {
      background-color: #ff9f0a;
      color: #ffffff;
      font-size: 48px; /* 運算符號放大 */
    }
  </style>
</head>
<body>

<div class="calculator">
  <!-- 1. 自訂匯率設定列 (日幣預設 0.21) -->
  <div class="rate-setting">
    <div class="rate-item">
      <span>日幣:</span>
      <input type="number" id="jpy-rate" value="0.21" step="0.001">
    </div>
    <div class="rate-item">
      <span>人民幣:</span>
      <input type="number" id="cny-rate" value="4.50" step="0.01">
    </div>
  </div>

  <!-- 2. 金額顯示區 (點擊外幣該行切換 JPY / CNY) -->
  <div class="display-area">
    <!-- 外幣輸入區 -->
    <div class="currency-row active" onclick="switchCurrency()">
      <div class="currency-tag" id="label-target">
        🇯🇵 JPY <span class="switch-hint">(切換)</span>
      </div>
      <div class="currency-amount" id="val-target">0</div>
    </div>
    <!-- 台幣結果區 -->
    <div class="currency-row">
      <div class="currency-tag base">🇹🇼 TWD</div>
      <div class="currency-amount" id="val-twd">0</div>
    </div>
  </div>

  <!-- 3. 計算機按鈕區 (右側運算符號依序為 + - × ÷) -->
  <div class="keypad">
    <button class="btn btn-dark" onclick="appendInput('7')">7</button>
    <button class="btn btn-dark" onclick="appendInput('8')">8</button>
    <button class="btn btn-dark" onclick="appendInput('9')">9</button>
    <button class="btn btn-orange" onclick="appendInput('+')">+</button>

    <button class="btn btn-dark" onclick="appendInput('4')">4</button>
    <button class="btn btn-dark" onclick="appendInput('5')">5</button>
    <button class="btn btn-dark" onclick="appendInput('6')">6</button>
    <button class="btn btn-orange" onclick="appendInput('-')">-</button>

    <button class="btn btn-dark" onclick="appendInput('1')">1</button>
    <button class="btn btn-dark" onclick="appendInput('2')">2</button>
    <button class="btn btn-dark" onclick="appendInput('3')">3</button>
    <button class="btn btn-orange" onclick="appendInput('×')">×</button>

    <button class="btn btn-dark" onclick="clearAll()">C</button>
    <button class="btn btn-dark" onclick="appendInput('0')">0</button>
    <button class="btn btn-dark" onclick="backspace()">←</button>
    <button class="btn btn-orange" onclick="appendInput('÷')">÷</button>
  </div>
</div>

<script>
  let currentInput = "0";
  let currentCurrency = "JPY";

  const valTarget = document.getElementById("val-target");
  const valTwd = document.getElementById("val-twd");
  const labelTarget = document.getElementById("label-target");
  const jpyRateInput = document.getElementById("jpy-rate");
  const cnyRateInput = document.getElementById("cny-rate");

  jpyRateInput.addEventListener("input", updateResult);
  cnyRateInput.addEventListener("input", updateResult);

  // 點擊 JPY/CNY 該行切換幣別
  function switchCurrency() {
    currentCurrency = (currentCurrency === "JPY") ? "CNY" : "JPY";
    labelTarget.innerHTML = currentCurrency === "JPY" 
      ? '🇯🇵 JPY <span class="switch-hint">(切換)</span>' 
      : '🇨🇳 CNY <span class="switch-hint">(切換)</span>';
    updateResult();
  }

  function appendInput(val) {
    if (currentInput === "0" && !isNaN(val)) {
      currentInput = val;
    } else {
      currentInput += val;
    }
    updateDisplay();
  }

  function backspace() {
    if (currentInput.length > 1) {
      currentInput = currentInput.slice(0, -1);
    } else {
      currentInput = "0";
    }
    updateDisplay();
  }

  function clearAll() {
    currentInput = "0";
    updateDisplay();
  }

  function updateDisplay() {
    valTarget.innerText = currentInput;
    updateResult();
  }

  function getCalculatedValue() {
    try {
      let rawExpression = currentInput.replace(/×/g, '*').replace(/÷/g, '/');
      let val = Function('"use strict"; return (' + rawExpression + ')')();
      return isNaN(val) || !isFinite(val) ? 0 : val;
    } catch (e) {
      return 0;
    }
  }

  function updateResult() {
    let rawAmount = getCalculatedValue();
    let rate = currentCurrency === 'JPY' 
      ? parseFloat(jpyRateInput.value) || 0 
      : parseFloat(cnyRateInput.value) || 0;
    
    let twdAmount = Math.round(rawAmount * rate);
    valTwd.innerText = twdAmount.toLocaleString();
  }

  // 實體鍵盤相容
  document.addEventListener('keydown', (e) => {
    if (e.key >= '0' && e.key <= '9') appendInput(e.key);
    if (e.key === '+') appendInput('+');
    if (e.key === '-') appendInput('-');
    if (e.key === '*') appendInput('×');
    if (e.key === '/') appendInput('÷');
    if (e.key === 'Backspace') backspace();
    if (e.key === 'Escape' || e.key.toLowerCase() === 'c') clearAll();
  });
</script>

</body>
</html>
