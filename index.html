<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>出國必備行李清單 ♡</title>
  <style>
    :root {
      --pink: #ff8fb1;
      --purple: #a78bfa;
      --yellow: #ffe08a;
      --mint: #a7ead5;
      --blue: #a8d8ff;
      --ink: #51465f;
      --muted: #8f849b;
      --card: rgba(255,255,255,.92);
      --shadow: 0 8px 24px rgba(126, 91, 148, .12);
      
      /* 字級變數（預設：中） */
      --font-base: 1.15rem;
      --font-title: 1.4rem;
      --font-hero: clamp(1.8rem, 6vw, 2.65rem);
    }

    html {
      scroll-behavior: smooth;
    }

    /* 字體大小切換 */
    body.font-small {
      --font-base: 0.95rem;
      --font-title: 1.15rem;
    }
    body.font-medium {
      --font-base: 1.15rem;
      --font-title: 1.4rem;
    }
    body.font-large {
      --font-base: 1.35rem;
      --font-title: 1.6rem;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 22px 14px 40px;
      font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% 8%, rgba(255,206,224,.8), transparent 24%),
        radial-gradient(circle at 94% 12%, rgba(216,204,255,.75), transparent 25%),
        radial-gradient(circle at 10% 88%, rgba(196,244,229,.7), transparent 25%),
        linear-gradient(145deg, #fff9fc, #f8f5ff 55%, #f4fffb);
      min-height: 100vh;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    .top-controls {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      margin-bottom: 12px;
    }

    .font-selector {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--card);
      padding: 6px 12px;
      border-radius: 99px;
      box-shadow: var(--shadow);
      font-size: 0.9rem;
      font-weight: 700;
    }

    .font-btn {
      border: none;
      background: transparent;
      padding: 4px 10px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 800;
      color: var(--muted);
    }

    .font-btn.active {
      background: #c4a7ff;
      color: white;
    }

    .hero {
      text-align: center;
      padding: 24px 18px 20px;
      margin-bottom: 18px;
      border: 2px solid rgba(255,255,255,.9);
      border-radius: 30px;
      background: rgba(255,255,255,.72);
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }

    .hero::before, .hero::after {
      content: "✦";
      position: absolute;
      color: #ffb4cf;
      font-size: 28px;
    }

    .hero::before { top: 18px; left: 22px; }
    .hero::after { right: 22px; bottom: 18px; color: #b9a5ff; }

    h1 {
      margin: 0 0 8px;
      color: #e66f9a;
      font-size: var(--font-hero);
      letter-spacing: 1px;
      line-height: 1.35;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 1rem;
    }

    /* 放大版跳出賀詞視窗 (Modal) */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(81, 70, 95, 0.5);
      backdrop-filter: blur(4px);
      z-index: 999;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-overlay.show {
      display: flex;
    }

    .modal-card {
      background: white;
      border-radius: 28px;
      padding: 32px 24px;
      text-align: center;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 12px 32px rgba(230, 111, 154, 0.3);
      border: 3px solid #ffb4cf;
      animation: modalPop 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes modalPop {
      0% { transform: scale(0.7); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .modal-card h2 {
      font-size: 2.2rem;
      color: #e66f9a;
      margin: 0 0 16px;
      line-height: 1.4;
    }

    .modal-card p {
      font-size: 1.2rem;
      color: var(--ink);
      margin-bottom: 24px;
      font-weight: 700;
    }

    .modal-close-btn {
      background: linear-gradient(135deg, #ff9fbd, #c4a7ff);
      color: white;
      border: none;
      padding: 12px 28px;
      font-size: 1.1rem;
      font-weight: 800;
      border-radius: 99px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(255, 143, 177, 0.4);
    }

    .progress-card, .category-progress-card, .category {
      background: var(--card);
      border: 2px solid rgba(255,255,255,.95);
      border-radius: 24px;
      box-shadow: var(--shadow);
    }

    .progress-card {
      padding: 18px 20px;
      margin-bottom: 14px;
      cursor: pointer;
      user-select: none;
      transition: transform .15s ease;
    }

    .progress-card:hover {
      transform: translateY(-2px);
    }

    .progress-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
      font-weight: 800;
      font-size: var(--font-base);
    }

    #progressText { color: #e66f9a; }

    .progress-track {
      height: 16px;
      background: #f2eafa;
      border-radius: 99px;
      overflow: hidden;
      border: 1px solid #eadff8;
    }

    #progressBar {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #ff9fbd, #c4a7ff, #8de0c7);
      transition: width .25s ease;
    }

    .toggle-hint {
      text-align: right;
      font-size: 0.8rem;
      color: #a78bfa;
      margin-top: 6px;
      font-weight: 700;
    }

    /* 各大項準備進度卡片 */
    .category-progress-card {
      padding: 16px 20px;
      margin-bottom: 18px;
      display: none; /* 預設收合 */
    }

    .category-progress-card.open {
      display: block;
    }

    .cat-progress-title {
      font-size: var(--font-base);
      font-weight: 800;
      margin: 0 0 12px;
      color: #7a63b8;
    }

    .cat-progress-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
    }

    .cat-progress-item {
      background: #fffafd;
      border: 1.5px solid #eee4f7;
      border-radius: 14px;
      padding: 10px 12px;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .cat-progress-item:hover {
      transform: translateY(-2px);
      border-color: #c4a7ff;
    }

    .cat-progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: calc(var(--font-base) * 0.85);
      font-weight: 700;
      margin-bottom: 6px;
    }

    .cat-progress-name {
      display: flex;
      align-items: center;
      gap: 4px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .cat-progress-val {
      color: #9d85e8;
    }

    .cat-progress-track {
      height: 8px;
      background: #f0e7fa;
      border-radius: 99px;
      overflow: hidden;
    }

    .cat-progress-fill {
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: #c4a7ff;
      transition: width .25s ease;
    }

    .toolbar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      margin: 0 0 14px;
    }

    .reset-btn {
      background: #fff0c7;
      color: #7d6230;
      border: 1px solid #ffe3a0;
      padding: 8px 16px;
      border-radius: 14px;
      font-weight: 800;
      font-size: 0.95rem;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(255, 227, 160, 0.4);
    }

    button {
      border: 0;
      border-radius: 14px;
      padding: 8px 14px;
      font-weight: 800;
      cursor: pointer;
      font-size: var(--font-base);
      transition: transform .15s ease, filter .15s ease;
    }

    button:hover { filter: brightness(.98); transform: translateY(-1px); }
    button:active { transform: translateY(0); }

    #checklist {
      display: grid;
      gap: 18px;
    }

    .category {
      overflow: hidden;
      scroll-margin-top: 20px;
    }

    .category-header {
      padding: 15px 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: var(--font-title);
      font-weight: 900;
    }

    .category-header .cat-emoji { font-size: 1.4em; }

    .category-header .cat-count {
      font-size: 0.85rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 99px;
      background: rgba(255,255,255,.7);
      white-space: nowrap;
    }

    .add-cat-btn {
      margin-left: auto;
      background: rgba(255,255,255,.85);
      color: inherit;
      border: 1.5px solid currentColor;
      padding: 5px 12px;
      font-size: 0.85rem;
      border-radius: 12px;
    }

    .cat-0 .category-header { background: #ffe4ee; color: #a64e76; }
    .cat-1 .category-header { background: #fff0c9; color: #8b6a26; }
    .cat-2 .category-header { background: #e5ddff; color: #7054b4; }
    .cat-3 .category-header { background: #d9f7ed; color: #367f6b; }

    .items-list { padding: 8px 14px 14px; }

    .item-row {
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      padding: 12px 7px;
      border-bottom: 1px dashed #eee4f4;
      min-height: 52px;
    }

    .item-row:last-child { border-bottom: 0; }

    .item-check {
      width: 24px;
      height: 24px;
      accent-color: #ec83aa;
      cursor: pointer;
    }

    .item-name {
      font-size: var(--font-base);
      line-height: 1.5;
      overflow-wrap: anywhere;
      cursor: pointer;
    }

    .item-row.packed .item-name {
      color: #a39aaa;
      text-decoration: line-through;
      text-decoration-thickness: 2px;
    }

    .delete-btn {
      padding: 6px 10px;
      border-radius: 10px;
      color: #bf6281;
      background: #fff0f5;
      font-size: 0.85rem;
    }

    .footer-note {
      margin-top: 22px;
      text-align: center;
      color: #9a8ea5;
      font-size: .9rem;
      line-height: 1.7;
    }

    @media (max-width: 620px) {
      body { padding: 12px 10px 28px; }
      .category-header { padding: 12px 14px; }
      .category-header .cat-count { display: none; }
    }
  </style>
</head>
<body class="font-medium">
  <main class="container">
    <div class="top-controls">
      <div class="font-selector">
        <span>字體大小：</span>
        <button class="font-btn" onclick="setFontSize('small')">小</button>
        <button class="font-btn active" onclick="setFontSize('medium')">中</button>
        <button class="font-btn" onclick="setFontSize('large')">大</button>
      </div>
    </div>

    <header class="hero">
      <h1>🎀 出國必備行李清單 🎀</h1>
      <p class="subtitle">把要帶的東西整理好，開心出發去旅行吧！✈️💗</p>
    </header>

    <!-- 可點擊展開/收合各大項進度的整體進度卡片 -->
    <section class="progress-card" onclick="toggleCatProgress()" aria-label="點擊展開/收合各大項進度">
      <div class="progress-top">
        <span>🧳 我的整體打包進度</span>
        <span id="progressText">0 / 0（0%）</span>
      </div>
      <div class="progress-track"
           role="progressbar"
           aria-label="整體打包進度"
           aria-valuemin="0"
           aria-valuemax="100"
           aria-valuenow="0"
           id="progressTrack">
        <div id="progressBar"></div>
      </div>
      <div class="toggle-hint" id="toggleHint">▼ 點擊查看各大項詳細進度</div>
    </section>

    <!-- 各大項準備進度卡片（點擊可滑動跳轉） -->
    <section class="category-progress-card" id="catProgressCard" aria-label="各大項準備進度">
      <div class="cat-progress-title">📊 各大項準備進度（點擊可快速跳轉）</div>
      <div class="cat-progress-grid" id="catProgressGrid"></div>
    </section>

    <div class="toolbar">
      <button class="reset-btn" type="button" onclick="resetPackedStatus()">
        🌷 一鍵重置
      </button>
    </div>

    <section id="checklist" aria-live="polite"></section>

    <p class="footer-note">
      ♡ 勾選已打包的物品，隨時確認準備進度 ♡<br>
      資料會儲存在這個瀏覽器中，記得不要清除網站資料喔！
    </p>
  </main>

  <!-- 全部完成的全螢幕彈窗 -->
  <div class="modal-overlay" id="congratsModal" onclick="closeModal()">
    <div class="modal-card" onclick="event.stopPropagation()">
      <h2>🎉 恭喜！</h2>
      <p>全部都準備好了，可以快樂出發了^^ ✈️💖</p>
      <button class="modal-close-btn" onclick="closeModal()">太棒了！</button>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'travel_checklist_v4';
    const FONT_STORAGE_KEY = 'travel_checklist_font';

    // 最新調整後的預設清單
    const defaultData = [
      // 1. 隨身證件
      { category: '隨身證件', name: '護照', packed: false },
      { category: '隨身證件', name: 'VJW QRCode', packed: false },
      { category: '隨身證件', name: '身分證', packed: false },
      { category: '隨身證件', name: '健保卡', packed: false },
      { category: '隨身證件', name: '信用卡 / 提款卡', packed: false },
      { category: '隨身證件', name: '日幣 / 台幣', packed: false },
      { category: '隨身證件', name: '悠遊卡', packed: false },
      { category: '隨身證件', name: '台鐵車票', packed: false },
      { category: '隨身證件', name: '手機', packed: false },

      // 2. 衣物穿搭
      { category: '衣物穿搭', name: '衣服', packed: false },
      { category: '衣物穿搭', name: '褲子', packed: false },
      { category: '衣物穿搭', name: '內衣 / 內褲', packed: false },
      { category: '衣物穿搭', name: '外套', packed: false },
      { category: '衣物穿搭', name: '襪子', packed: false },
      { category: '衣物穿搭', name: '圍巾', packed: false },
      { category: '衣物穿搭', name: '皮帶', packed: false },
      { category: '衣物穿搭', name: '帽子', packed: false },

      // 3. 3C 電器
      { category: '3C 電器', name: '行動電源', packed: false },
      { category: '3C 電器', name: '藍牙耳機', packed: false },
      { category: '3C 電器', name: '充電線', packed: false },
      { category: '3C 電器', name: '充電器', packed: false },
      { category: '3C 電器', name: '手機架', packed: false },
      { category: '3C 電器', name: '自拍棒', packed: false },

      // 4. 日常用品
      { category: '日常用品', name: '雨傘', packed: false },
      { category: '日常用品', name: '筆', packed: false },
      { category: '日常用品', name: '衛生紙或濕紙巾', packed: false },
      { category: '日常用品', name: '梳子', packed: false },
      { category: '日常用品', name: '牙刷 / 牙膏 / 牙線', packed: false },
      { category: '日常用品', name: '毛巾', packed: false },
      { category: '日常用品', name: '衛生棉 / 護墊', packed: false },
      { category: '日常用品', name: 'OK繃', packed: false },
      { category: '日常用品', name: '橡皮筋 / 髮夾 / 髮圈', packed: false },
      { category: '日常用品', name: '指甲刀 / 小剪刀', packed: false },
      { category: '日常用品', name: '藥', packed: false },
      { category: '日常用品', name: '痘痘貼 / 保養品 / 防曬', packed: false },
      { category: '日常用品', name: '口罩', packed: false },
      { category: '日常用品', name: '室內拖鞋', packed: false },
      { category: '日常用品', name: '垃圾袋', packed: false },
      { category: '日常用品', name: '收納行李袋', packed: false }
    ];

    const categoryOrder = [
      '隨身證件',
      '衣物穿搭',
      '3C 電器',
      '日常用品'
    ];

    const categoryIcons = {
      '隨身證件': '🪪',
      '衣物穿搭': '👗',
      '3C 電器': '🎧',
      '日常用品': '🧴'
    };

    function loadItems() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (!saved) return defaultData.map(item => ({ ...item }));
        const parsed = JSON.parse(saved);
        if (!Array.isArray(parsed)) return defaultData.map(item => ({ ...item }));
        return parsed;
      } catch (error) {
        return defaultData.map(item => ({ ...item }));
      }
    }

    let items = loadItems();
    let modalShownThisSession = false; // 避免持續彈出

    function saveItems() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
        renderList();
        return true;
      } catch (error) {
        alert('目前無法儲存資料。');
        renderList();
        return false;
      }
    }

    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[char]));
    }

    /* 各大項進度卡片展開與收合 */
    function toggleCatProgress() {
      const card = document.getElementById('catProgressCard');
      const hint = document.getElementById('toggleHint');
      const isOpen = card.classList.toggle('open');
      hint.textContent = isOpen ? '▲ 點擊收合各大項詳細進度' : '▼ 點擊查看各大項詳細進度';
    }

    /* 點擊各大項進度，滑動跳轉到指定區域 */
    function scrollToCategory(catId) {
      const target = document.getElementById(`cat-sec-${catId}`);
      if (target) {
        target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }

    /* 字體大小設置 */
    function setFontSize(size) {
      document.body.className = `font-${size}`;
      document.querySelectorAll('.font-btn').forEach(btn => {
        btn.classList.toggle('active', btn.textContent === (size === 'small' ? '小' : size === 'medium' ? '中' : '大'));
      });
      localStorage.setItem(FONT_STORAGE_KEY, size);
    }

    function loadFontSize() {
      const saved = localStorage.getItem(FONT_STORAGE_KEY) || 'medium';
      setFontSize(saved);
    }

    function closeModal() {
      document.getElementById('congratsModal').classList.remove('show');
    }

    function updateProgress(categories) {
      const packedCount = items.filter(item => item.packed).length;
      const total = items.length;
      const percent = total ? Math.round((packedCount / total) * 100) : 0;

      document.getElementById('progressText').textContent = `${packedCount} / ${total}（${percent}%）`;
      document.getElementById('progressBar').style.width = `${percent}%`;

      // 全部完成時彈出全螢幕賀詞
      if (total > 0 && packedCount === total) {
        if (!modalShownThisSession) {
          document.getElementById('congratsModal').classList.add('show');
          modalShownThisSession = true;
        }
      } else {
        modalShownThisSession = false; // 若取消勾選，重置標記
        closeModal();
      }

      const grid = document.getElementById('catProgressGrid');
      grid.innerHTML = '';

      categories.forEach(category => {
        const categoryItems = items.filter(item => item.category === category);
        if (!categoryItems.length) return;

        const cPacked = categoryItems.filter(item => item.packed).length;
        const cTotal = categoryItems.length;
        const cPercent = cTotal ? Math.round((cPacked / cTotal) * 100) : 0;
        const icon = categoryIcons[category] || '🌸';

        const itemEl = document.createElement('div');
        itemEl.className = 'cat-progress-item';
        itemEl.onclick = () => scrollToCategory(category);
        itemEl.innerHTML = `
          <div class="cat-progress-header">
            <span class="cat-progress-name"><span>${icon}</span> ${escapeHTML(category)}</span>
            <span class="cat-progress-val">${cPacked}/${cTotal} (${cPercent}%)</span>
          </div>
          <div class="cat-progress-track">
            <div class="cat-progress-fill" style="width: ${cPercent}%"></div>
          </div>
        `;
        grid.appendChild(itemEl);
      });
    }

    function renderList() {
      const checklist = document.getElementById('checklist');
      checklist.innerHTML = '';

      const categories = [...categoryOrder];
      items.forEach(item => {
        if (!categories.includes(item.category)) categories.push(item.category);
      });

      categories.forEach(category => {
        const categoryItems = items
          .map((item, index) => ({ ...item, index }))
          .filter(item => item.category === category);

        const categoryIndex = categoryOrder.indexOf(category);
        const catClass = categoryIndex >= 0 ? `cat-${categoryIndex}` : 'cat-other';
        const icon = categoryIcons[category] || '🌸';

        const packedCount = categoryItems.filter(item => item.packed).length;
        const totalCount = categoryItems.length;

        const section = document.createElement('section');
        section.className = `category ${catClass}`;
        section.id = `cat-sec-${category}`; // 設定跳轉識別 ID

        section.innerHTML = `
          <div class="category-header">
            <span class="cat-emoji">${icon}</span>
            <span>${escapeHTML(category)}</span>
            <span class="cat-count">${packedCount} / ${totalCount} 已完成</span>
            <button class="add-cat-btn" onclick="addItemToCategory('${escapeHTML(category)}')">＋ 新增</button>
          </div>
          <div class="items-list"></div>
        `;

        const list = section.querySelector('.items-list');

        categoryItems.forEach(item => {
          const row = document.createElement('div');
          row.className = `item-row${item.packed ? ' packed' : ''}`;

          row.innerHTML = `
            <input
              class="item-check"
              type="checkbox"
              ${item.packed ? 'checked' : ''}
              onchange="togglePacked(${item.index})"
            >

            <span
              class="item-name"
              onclick="togglePackedDirect(${item.index})"
            >${escapeHTML(item.name)}</span>

            <button
              class="delete-btn"
              type="button"
              onclick="deleteItem(${item.index})"
            >刪除</button>
          `;

          list.appendChild(row);
        });

        checklist.appendChild(section);
      });

      updateProgress(categories);
    }

    /* 一鍵重置（只重置勾選狀態，保留清單內容） */
    function resetPackedStatus() {
      if (!confirm('確定要一鍵重置所有項目的「已完成」狀態嗎？')) return;
      items = items.map(item => ({ ...item, packed: false }));
      saveItems();
    }

    /* 單獨在大項新增物品 */
    function addItemToCategory(categoryName) {
      const name = prompt(`要在「${categoryName}」新增什麼物品？`);
      if (name && name.trim()) {
        items.push({
          category: categoryName,
          name: name.trim(),
          packed: false
        });
        saveItems();
      }
    }

    function togglePacked(index) {
      if (!items[index]) return;
      items[index].packed = !items[index].packed;
      saveItems();
    }

    function togglePackedDirect(index) {
      if (!items[index]) return;
      items[index].packed = !items[index].packed;
      saveItems();
    }

    function deleteItem(index) {
      if (!items[index]) return;
      const name = items[index].name;
      if (!confirm(`確定要刪除「${name}」嗎？`)) return;

      items.splice(index, 1);
      saveItems();
    }

    // 初始化
    loadFontSize();
    renderList();
  </script>
</body>
</html>
