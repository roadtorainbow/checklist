
<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#F8F5F0">
<title>外匯計算機</title>
<style>
:root {
  --bg:#F8F5F0; --card:#FFFFFF; --text:#37332F;
  --muted:#938A81; --pink:#E9B8B5; --pink-light:#F8E9E6;
  --orange:#C98769; --line:#EDE6DF;
}
* { box-sizing:border-box; margin:0; padding:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif; }
html,body { width:100%; height:100%; overflow:hidden; }
body { background:var(--bg); color:var(--text); }
.calculator {
  width:100%; max-width:480px; height:100vh; height:100dvh;
  margin:auto; padding:16px 18px;
  display:flex; flex-direction:column; gap:13px;
}
.header { flex-shrink:0; padding:3px; }
.eyebrow { font-size:11px; letter-spacing:3px; color:var(--orange); font-weight:800; }
h1 { font-size:27px; margin-top:5px; }
.subtitle { font-size:13px; color:var(--muted); margin-top:4px; }
.rate-setting {
  display:grid; grid-template-columns:1fr 1fr; gap:10px;
  padding:13px; background:white; border:1px solid var(--line);
  border-radius:18px; box-shadow:0 5px 20px #5b46350a; flex-shrink:0;
}
.rate-item { display:flex; flex-direction:column; gap:8px; min-width:0; }
.rate-label { font-size:13px; font-weight:700; color:var(--muted); }
.rate-wrap { display:flex; align-items:center; gap:4px; padding:9px;
  background:#F8F5F1; border-radius:10px; }
.rate-wrap span { color:var(--muted); font-size:12px; }
.rate-item input { width:100%; min-width:0; border:0; outline:0;
  background:transparent; color:var(--text); text-align:right;
  font-size:19px; font-weight:750; }
.display-area {
  flex:1; min-height:0; display:flex; flex-direction:column;
  justify-content:center; gap:12px;
}
.currency-row {
  min-width:0; min-height:105px; padding:17px 18px;
  border-radius:21px; display:flex; flex-direction:column;
  justify-content:space-between; gap:12px; overflow:hidden;
}
.target { background:white; border:1.5px solid #E9D7D0;
  box-shadow:0 5px 20px #5b46350a; cursor:pointer; }
.base { background:var(--pink-light); border:1px solid #F0DAD5; }
.currency-heading { display:flex; justify-content:space-between; align-items:center; gap:8px; }
.currency-tag { font-size:15px; font-weight:750; }
.hint { font-size:11px; color:var(--orange); }
.base .currency-tag,.base .amount { color:#A86F65; }
.amount {
  width:100%; min-width:0; text-align:right; white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis; font-size:clamp(30px,8vw,46px);
  line-height:1.2; font-weight:800; font-variant-numeric:tabular-nums;
}
.amount.long { font-size:clamp(21px,5.5vw,30px); }
.amount.very-long { font-size:clamp(16px,4.5vw,23px); }
.keypad {
  flex-shrink:0; height:40%; min-height:220px; max-height:380px;
  display:grid; grid-template-columns:repeat(4,minmax(0,1fr));
  grid-template-rows:repeat(4,minmax(0,1fr)); gap:10px;
}
.btn {
  min-width:0; min-height:0; border:0; border-radius:17px;
  font-size:clamp(25px,5vh,35px); font-weight:650;
  color:var(--text); background:white;
  box-shadow:0 3px 9px #5b46350b; cursor:pointer;
  touch-action:manipulation;
}
.btn:active { transform:scale(.95); }
.func { background:#EFE8E1; color:#77685C; }
.op { background:var(--pink); color:#563F3B; font-size:clamp(30px,6vh,42px); }
.clear { background:#F5DEDA; color:#A45E57; }
@media(max-height:650px) {
  .calculator { padding:9px 14px; gap:8px; }
  .header h1 { font-size:22px; }
  .rate-setting { padding:8px 10px; }
  .currency-row { min-height:78px; padding:12px 15px; gap:7px; }
  .keypad { min-height:190px; gap:7px; }
  .btn { border-radius:13px; }
}
</style>
</head>
<body>
<div class="calculator">
  <header class="header">
    <div class="eyebrow">TRAVEL · CURRENCY</div>
    <h1>外匯計算機 ♡</h1>
    <p class="subtitle">簡單換算，讓旅行花費更清楚</p>
  </header>

  <section class="rate-setting">
    <div class="rate-item">
      <label class="rate-label" for="jpy-rate">🇯🇵 日幣匯率</label>
      <div class="rate-wrap"><span>1 JPY</span>
        <input type="number" id="jpy-rate" value="0.21" step="0.001" min="0">
      </div>
    </div>
    <div class="rate-item">
      <label class="rate-label" for="cny-rate">🇨🇳 人民幣匯率</label>
      <div class="rate-wrap"><span>1 CNY</span>
        <input type="number" id="cny-rate" value="4.50" step="0.01" min="0">
      </div>
    </div>
  </section>

  <main class="display-area">
    <section class="currency-row target" id="target-row"
      role="button" tabindex="0" aria-label="切換日幣或人民幣">
      <div class="currency-heading">
        <div class="currency-tag" id="label-target">🇯🇵 JPY 日幣</div>
        <span class="hint">點擊切換 ↻</span>
      </div>
      <div class="amount" id="val-target">0</div>
    </section>
    <section class="currency-row base">
      <div class="currency-heading">
        <div class="currency-tag">🇹🇼 TWD 台幣</div>
        <span class="hint">換算結果</span>
      </div>
      <div class="amount" id="val-twd">0</div>
    </section>
  </main>

  <section class="keypad">
    <button class="btn" data-value="7">7</button>
    <button class="btn" data-value="8">8</button>
    <button class="btn" data-value="9">9</button>
    <button class="btn op" data-value="÷">÷</button>
    <button class="btn" data-value="4">4</button>
    <button class="btn" data-value="5">5</button>
    <button class="btn" data-value="6">6</button>
    <button class="btn op" data-value="×">×</button>
    <button class="btn" data-value="1">1</button>
    <button class="btn" data-value="2">2</button>
    <button class="btn" data-value="3">3</button>
    <button class="btn op" data-value="-">−</button>
    <button class="btn clear" id="clear">C</button>
    <button class="btn" data-value="0">0</button>
    <button class="btn func" id="backspace">⌫</button>
    <button class="btn op" data-value="+">+</button>
  </section>
</div>

<script>
let currentInput = "0";
let currentCurrency = "JPY";

const target = document.getElementById("val-target");
const twd = document.getElementById("val-twd");
const label = document.getElementById("label-target");
const jpyRate = document.getElementById("jpy-rate");
const cnyRate = document.getElementById("cny-rate");

function formatNumber(n) {
  if (!Number.isFinite(n)) return "0";
  return Number(n.toPrecision(12)).toLocaleString("en-US", {
    maximumFractionDigits: 8
  });
}

function fitAmount(el, text) {
  el.textContent = text;
  el.classList.remove("long", "very-long");
  if (text.length > 15) el.classList.add("very-long");
  else if (text.length > 10) el.classList.add("long");
}

function calculate() {
  // 僅接受數字、小數點和四則運算符號
  const expression = currentInput.replace(/[×÷]/g, c =>
    c === "×" ? "*" : "/"
  );

  if (!/^[\d.+*/\- ]+$/.test(expression)) return 0;

  try {
    const result = Function('"use strict";return (' + expression + ')')();
    return Number.isFinite(result) ? result : 0;
  } catch {
    return 0;
  }
}

function updateResult() {
  const amount = calculate();
  const inputRate = currentCurrency === "JPY" ? jpyRate : cnyRate;
  const rate = Number(inputRate.value);

  const safeRate = Number.isFinite(rate) && rate >= 0 ? rate : 0;
  fitAmount(twd, Math.round(amount * safeRate).toLocaleString("en-US"));
}

function updateDisplay() {
  fitAmount(target, currentInput);
  updateResult();
}

function appendInput(value) {
  const isDigit = /^[0-9]$/.test(value);

  if (currentInput === "0" && isDigit) {
    currentInput = value;
  } else if (currentInput === "0" && value === ".") {
    currentInput = "0.";
  } else {
    currentInput += value;
  }
  updateDisplay();
}

function clearAll() {
  currentInput = "0";
  updateDisplay();
}

function backspace() {
  currentInput = currentInput.length > 1
    ? currentInput.slice(0, -1)
    : "0";
  updateDisplay();
}

function switchCurrency() {
  currentCurrency = currentCurrency === "JPY" ? "CNY" : "JPY";
  label.textContent = currentCurrency === "JPY"
    ? "🇯🇵 JPY 日幣"
    : "🇨🇳 CNY 人民幣";
  updateResult();
}

document.querySelectorAll("[data-value]").forEach(button => {
  button.addEventListener("click", () => appendInput(button.dataset.value));
});

document.getElementById("clear").addEventListener("click", clearAll);
document.getElementById("backspace").addEventListener("click", backspace);

document.getElementById("target-row").addEventListener("click", switchCurrency);
document.getElementById("target-row").addEventListener("keydown", e => {
  if (e.key === "Enter" || e.key === " ") {
    e.preventDefault();
    switchCurrency();
  }
});

jpyRate.addEventListener("input", updateResult);
cnyRate.addEventListener("input", updateResult);

document.addEventListener("keydown", e => {
  if (/^[0-9.]$/.test(e.key)) appendInput(e.key);
  else if (["+", "-"].includes(e.key)) appendInput(e.key);
  else if (e.key === "*") appendInput("×");
  else if (e.key === "/") {
    e.preventDefault();
    appendInput("÷");
  }
  else if (e.key === "Backspace") backspace();
  else if (e.key === "Escape" || e.key.toLowerCase() === "c") clearAll();
});

updateDisplay();
</script>
</body>
</html>
