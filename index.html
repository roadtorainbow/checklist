<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>外匯計算機</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #f4f5f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    .calculator {
      width: 100%;
      max-width: 360px;
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    /* 匯率設定區 */
    .rate-setting {
      background: #f8f9fa;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .rate-title {
      font-size: 13px;
      color: #666;
      font-weight: 600;
    }
    .rate-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
    }
    .rate-input-group {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .rate-input-group input {
      width: 80px;
      padding: 4px 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
      text-align: right;
      font-size: 14px;
    }

    /* 幣別選擇切換 */
    .currency-selector {
      display: flex;
      background: #eee;
      border-radius: 10px;
      padding: 3px;
    }
    .currency-btn {
      flex: 1;
      border: none;
      background: transparent;
      padding: 8px 0;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      color: #555;
      cursor: pointer;
      transition: all 0.2s;
    }
    .currency-btn.active {
      background: #fff;
      color: #2b3a4a;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    /* 顯示螢幕 */
    .screen {
      text-align: right;
      min-height: 90px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 10px 0;
    }
    .expression {
      font-size: 28px;
      color: #222;
      word-break: break-all;
      min-height: 36px;
    }
    .result {
      font-size: 22px;
      color: #4c5d73;
      margin-top: 4px;
      font-weight: 500;
    }

    /* 按鈕區域 */
    .keypad {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    .btn {
      aspect-ratio: 1;
      border: none;
      border-radius: 50%;
      font-size: 20px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: filter 0.15s, transform 0.1s;
      user-select: none;
    }
    .btn:active {
      transform: scale(0.95);
    }
    /* 按鈕色彩設定 (仿圖片風格) */
    .btn-num {
      background-color: #e8ecef;
      color: #1a1a1a;
    }
    .btn-op {
      background-color: #5c7080;
      color: #ffffff;
    }
    .btn-func {
      background-color: #4a6fa5;
      color: #ffffff;
    }
    .btn-equal {
      background-color: #2b3a55;
      color: #ffffff;
    }
  </style>
</head>
<body>

<div class="calculator">
  <!-- 1. 自訂匯率設定 -->
  <div class="rate-setting">
    <div class="rate-title">自訂匯率 (1 外幣 = ? 新台幣)</div>
    <div class="rate-row">
      <label for="jpy-rate">日幣 (JPY):</label>
      <div class="rate-input-group">
        <input type="number" id="jpy-rate" value="0.215" step="0.001"> TWD
      </div>
    </div>
    <div class="rate-row">
      <label for="cny-rate">人民幣 (CNY):</label>
      <div class="rate-input-group">
        <input type="number" id="cny-rate" value="4.500" step="0.01"> TWD
      </div>
    </div>
  </div>

  <!-- 2. 幣別選擇器 -->
  <div class="currency-selector">
    <button class="currency-btn active" id="btn-jpy" onclick="setCurrency('JPY')">日幣 JPY</button>
    <button class="currency-btn" id="btn-cny" onclick="setCurrency('CNY')">人民幣 CNY</button>
  </div>

  <!-- 3. 計算與結果顯示區 -->
  <div class="screen">
    <div class="expression" id="expression">0</div>
    <div class="result" id="result">≈ 0 TWD</div>
  </div>

  <!-- 4. 計算機按鈕區 -->
  <div class="keypad">
    <button class="btn btn-func" onclick="clearAll()">AC</button>
    <button class="btn btn-op" onclick="appendInput('(')">(</button>
    <button class="btn btn-op" onclick="appendInput(')')">)</button>
    <button class="btn btn-op" onclick="appendInput('÷')">÷</button>

    <button class="btn btn-num" onclick="appendInput('7')">7</button>
    <button class="btn btn-num" onclick="appendInput('8')">8</button>
    <button class="btn btn-num" onclick="appendInput('9')">9</button>
    <button class="btn btn-op" onclick="appendInput('×')">×</button>

    <button class="btn btn-num" onclick="appendInput('4')">4</button>
    <button class="btn btn-num" onclick="appendInput('5')">5</button>
    <button class="btn btn-num" onclick="appendInput('6')">6</button>
    <button class="btn btn-op" onclick="appendInput('-')">-</button>

    <button class="btn btn-num" onclick="appendInput('1')">1</button>
    <button class="btn btn-num" onclick="appendInput('2')">2</button>
    <button class="btn btn-num" onclick="appendInput('3')">3</button>
    <button class="btn btn-op" onclick="appendInput('+')">+</button>

    <button class="btn btn-num" onclick="appendInput('0')">0</button>
    <button class="btn btn-num" onclick="appendInput('.')">.</button>
    <button class="btn btn-op" onclick="backspace()">⌫</button>
    <button class="btn btn-equal" onclick="calculate()">=</button>
  </div>
</div>

<script>
  let currentInput = "0";
  let currentCurrency = "JPY";

  const expressionEl = document.getElementById("expression");
  const resultEl = document.getElementById("result");
  const jpyRateInput = document.getElementById("jpy-rate");
  const cnyRateInput = document.getElementById("cny-rate");

  // 監聽匯率變動時即時更新計算結果
  jpyRateInput.addEventListener("input", updateResult);
  cnyRateInput.addEventListener("input", updateResult);

  function setCurrency(currency) {
    currentCurrency = currency;
    document.getElementById("btn-jpy").classList.toggle("active", currency === 'JPY');
    document.getElementById("btn-cny").classList.toggle("active", currency === 'CNY');
    updateResult();
  }

  function appendInput(val) {
    if (currentInput === "0" && !isNaN(val)) {
      currentInput = val;
    } else {
      currentInput += val;
    }
    updateDisplay();
  }

  function backspace() {
    if (currentInput.length > 1) {
      currentInput = currentInput.slice(0, -1);
    } else {
      currentInput = "0";
    }
    updateDisplay();
  }

  function clearAll() {
    currentInput = "0";
    updateDisplay();
  }

  function updateDisplay() {
    expressionEl.innerText = currentInput;
    updateResult();
  }

  function getCalculatedValue() {
    try {
      // 替換運算符號為 JavaScript 可執行的語法
      let rawExpression = currentInput.replace(/×/g, '*').replace(/÷/g, '/');
      // 安全評估數學表達式
      let val = Function('"use strict"; return (' + rawExpression + ')')();
      return isNaN(val) || !isFinite(val) ? 0 : val;
    } catch (e) {
      return 0;
    }
  }

  function updateResult() {
    let rawAmount = getCalculatedValue();
    let rate = currentCurrency === 'JPY' 
      ? parseFloat(jpyRateInput.value) || 0 
      : parseFloat(cnyRateInput.value) || 0;
    
    let twdAmount = Math.round(rawAmount * rate);
    resultEl.innerText = `≈ ${twdAmount.toLocaleString()} TWD`;
  }

  function calculate() {
    let rawAmount = getCalculatedValue();
    currentInput = rawAmount.toString();
    updateDisplay();
  }

  // 支援實體鍵盤輸入
  document.addEventListener('keydown', (e) => {
    if ((e.key >= '0' && e.key <= '9') || e.key === '.') appendInput(e.key);
    if (e.key === '+') appendInput('+');
    if (e.key === '-') appendInput('-');
    if (e.key === '*') appendInput('×');
    if (e.key === '/') appendInput('÷');
    if (e.key === '(' || e.key === ')') appendInput(e.key);
    if (e.key === 'Enter' || e.key === '=') calculate();
    if (e.key === 'Backspace') backspace();
    if (e.key === 'Escape') clearAll();
  });
</script>

</body>
</html>
