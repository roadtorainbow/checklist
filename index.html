<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>外匯計算機</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden; /* 防止整頁上下滾動 */
      background-color: #1c1c1e;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .calculator {
      width: 100%;
      max-width: 420px;
      height: 100%;
      max-height: 900px;
      background: #000000;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px;
    }

    /* 頂部匯率設定（收納為簡潔列） */
    .rate-setting {
      background: #1c1c1e;
      border-radius: 12px;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #aaa;
    }
    .rate-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .rate-item input {
      width: 60px;
      background: #2c2c2e;
      border: 1px solid #444;
      color: #fff;
      border-radius: 6px;
      text-align: right;
      padding: 2px 4px;
      font-size: 13px;
    }

    /* 顯示區域 (固定高度) */
    .display-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 10px 16px;
      gap: 12px;
    }
    .currency-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      padding: 6px 10px;
      border-radius: 10px;
      transition: background 0.2s;
    }
    .currency-row.active {
      background: #1c1c1e;
    }
    .currency-tag {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 18px;
      font-weight: 600;
    }
    .currency-amount {
      font-size: 32px;
      font-weight: 400;
      word-break: break-all;
      text-align: right;
    }

    /* 按鈕區域 */
    .keypad {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      padding-bottom: 8px;
    }
    .btn {
      height: 64px;
      border: none;
      border-radius: 12px;
      font-size: 24px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      user-select: none;
      transition: opacity 0.1s;
    }
    .btn:active {
      opacity: 0.7;
    }
    /* 深色介面配色 (參考新圖) */
    .btn-dark {
      background-color: #333333;
      color: #ffffff;
    }
    .btn-orange {
      background-color: #ff9f0a;
      color: #ffffff;
      font-size: 28px;
    }
    .btn-top {
      background-color: #444444;
      color: #ffffff;
    }
  </style>
</head>
<body>

<div class="calculator">
  <!-- 1. 自訂匯率設定列 -->
  <div class="rate-setting">
    <div class="rate-item">
      <span>日幣 JPY:</span>
      <input type="number" id="jpy-rate" value="0.215" step="0.001">
    </div>
    <div class="rate-item">
      <span>人民幣 CNY:</span>
      <input type="number" id="cny-rate" value="4.50" step="0.01">
    </div>
  </div>

  <!-- 2. 金額顯示區 (點擊可切換當前輸入的幣別) -->
  <div class="display-area">
    <!-- 主幣別 / 輸入幣別 -->
    <div class="currency-row active" id="row-target" onclick="toggleCurrencyMode()">
      <div class="currency-tag" id="label-target">🇯🇵 JPY</div>
      <div class="currency-amount" id="val-target">0</div>
    </div>
    <!-- 換算後的幣別 (台幣) -->
    <div class="currency-row" id="row-base">
      <div class="currency-tag">🇹🇼 TWD</div>
      <div class="currency-amount" id="val-twd">0</div>
    </div>
  </div>

  <!-- 3. 計算機按鈕區 (依據新圖佈局) -->
  <div class="keypad">
    <button class="btn btn-top" onclick="clearAll()">C</button>
    <button class="btn btn-top" onclick="backspace()">←</button>
    <button class="btn btn-top" onclick="switchCurrency()">⇅</button>
    <button class="btn btn-orange" onclick="appendInput('÷')">÷</button>

    <button class="btn btn-dark" onclick="appendInput('7')">7</button>
    <button class="btn btn-dark" onclick="appendInput('8')">8</button>
    <button class="btn btn-dark" onclick="appendInput('9')">9</button>
    <button class="btn btn-orange" onclick="appendInput('×')">×</button>

    <button class="btn btn-dark" onclick="appendInput('4')">4</button>
    <button class="btn btn-dark" onclick="appendInput('5')">5</button>
    <button class="btn btn-dark" onclick="appendInput('6')">6</button>
    <button class="btn btn-orange" onclick="appendInput('-')">-</button>

    <button class="btn btn-dark" onclick="appendInput('1')">1</button>
    <button class="btn btn-dark" onclick="appendInput('2')">2</button>
    <button class="btn btn-dark" onclick="appendInput('3')">3</button>
    <button class="btn btn-orange" onclick="appendInput('+')">+</button>

    <button class="btn btn-dark" onclick="appendInput('%')">%</button>
    <button class="btn btn-dark" onclick="appendInput('0')">0</button>
    <button class="btn btn-dark" onclick="appendInput('.')">.</button>
    <button class="btn btn-orange" onclick="calculate()">=</button>
  </div>
</div>

<script>
  let currentInput = "0";
  let currentCurrency = "JPY"; // 可切換 'JPY' 或 'CNY'

  const valTarget = document.getElementById("val-target");
  const valTwd = document.getElementById("val-twd");
  const labelTarget = document.getElementById("label-target");
  const jpyRateInput = document.getElementById("jpy-rate");
  const cnyRateInput = document.getElementById("cny-rate");

  jpyRateInput.addEventListener("input", updateResult);
  cnyRateInput.addEventListener("input", updateResult);

  // 切換日幣與人民幣
  function switchCurrency() {
    currentCurrency = (currentCurrency === "JPY") ? "CNY" : "JPY";
    labelTarget.innerText = currentCurrency === "JPY" ? "🇯🇵 JPY" : "🇨🇳 CNY";
    updateResult();
  }

  function appendInput(val) {
    if (currentInput === "0" && !isNaN(val)) {
      currentInput = val;
    } else {
      currentInput += val;
    }
    updateDisplay();
  }

  function backspace() {
    if (currentInput.length > 1) {
      currentInput = currentInput.slice(0, -1);
    } else {
      currentInput = "0";
    }
    updateDisplay();
  }

  function clearAll() {
    currentInput = "0";
    updateDisplay();
  }

  function updateDisplay() {
    valTarget.innerText = currentInput;
    updateResult();
  }

  function getCalculatedValue() {
    try {
      let rawExpression = currentInput.replace(/×/g, '*').replace(/÷/g, '/').replace(/%/g, '/100');
      let val = Function('"use strict"; return (' + rawExpression + ')')();
      return isNaN(val) || !isFinite(val) ? 0 : val;
    } catch (e) {
      return 0;
    }
  }

  function updateResult() {
    let rawAmount = getCalculatedValue();
    let rate = currentCurrency === 'JPY' 
      ? parseFloat(jpyRateInput.value) || 0 
      : parseFloat(cnyRateInput.value) || 0;
    
    let twdAmount = Math.round(rawAmount * rate);
    valTwd.innerText = twdAmount.toLocaleString();
  }

  function calculate() {
    let rawAmount = getCalculatedValue();
    currentInput = rawAmount.toString();
    updateDisplay();
  }

  // 鍵盤相容
  document.addEventListener('keydown', (e) => {
    if ((e.key >= '0' && e.key <= '9') || e.key === '.') appendInput(e.key);
    if (e.key === '+') appendInput('+');
    if (e.key === '-') appendInput('-');
    if (e.key === '*') appendInput('×');
    if (e.key === '/') appendInput('÷');
    if (e.key === '%') appendInput('%');
    if (e.key === 'Enter' || e.key === '=') calculate();
    if (e.key === 'Backspace') backspace();
    if (e.key === 'Escape') clearAll();
  });
</script>

</body>
</html>
